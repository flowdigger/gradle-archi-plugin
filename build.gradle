import java.security.MessageDigest

plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'com.github.spotbugs' version '6.1.0'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'org.flowdigger.gradle'
version = '1.0.1'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    testImplementation gradleTestKit()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-archi-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-archi-plugin.git'

    plugins {
        archiPlugin {
            id = 'org.flowdigger.gradle.archi'
            implementationClass = 'org.flowdigger.gradle.archi.ArchiGradlePlugin'
            displayName = 'Archi Plugin'
            description = 'Gradle plugin for Archi architecture description tasks.'
            tags = ['archi', 'architecture', 'modeling']
        }
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Archi Plugin'
            description = 'Gradle plugin for Archi architecture description'
            url = 'https://github.com/flowdigger/gradle-archi-plugin'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                }
            }

            developers {
                developer {
                    id = 'flowdigger'
                    name = 'Flowdigger'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/flowdigger/gradle-archi-plugin.git'
                developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-archi-plugin.git'
                url = 'https://github.com/flowdigger/gradle-archi-plugin'
            }
        }
    }

    repositories {
        mavenLocal()
        maven {
            name = 'sonatype'
            def releasesRepoUrl = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            url = uri(version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl)
            credentials {
                username = providers.gradleProperty('mavenCentralUsername').orNull
                password = providers.gradleProperty('mavenCentralPassword').orNull
            }
        }
    }
}

signing {
    def signingKey = providers.gradleProperty("signingKey").orNull
    def signingPassword = providers.gradleProperty("signingPassword").orNull
    def signingKeyId = providers.gradleProperty("signingKeyId").orNull
    def validKeyIdPattern = ~/(?i)^[0-9a-f]{8}([0-9a-f]{8})?$/
    def normalizedSigningKeyId = signingKeyId
            ?.trim()
            ?.replaceFirst(/^(?i)0x/, '')
    if (!(normalizedSigningKeyId ==~ validKeyIdPattern)) {
        normalizedSigningKeyId = null
    }
    if (signingKey && signingPassword) {
        if (normalizedSigningKeyId) {
            useInMemoryPgpKeys(normalizedSigningKeyId, signingKey, signingPassword)
        } else {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    } else {
        useGpgCmd()
    }
    sign publishing.publications
}

// OWASP Dependency-Check configuration
def dependencyCheckSuppression = file('dependency-check-suppressions.xml')
dependencyCheck {
    formats = ['HTML', 'JSON', 'XML']
    failBuildOnCVSS = 7.0
    if (dependencyCheckSuppression.exists()) {
        suppressionFile = dependencyCheckSuppression.absolutePath
    }
//    enableExperimental = false
    analyzers {
        ossIndex {
            enabled = false
        }
    }

    // NVD API key configuration (improves scan speed by 30-50%)
    // Get key from: https://nvd.nist.gov/developers/request-an-api-key
    nvd {
        apiKey = findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
 //       apiDelay = 100  // Milliseconds between API calls (optional)
    }
}

// SpotBugs configuration
spotbugs {
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.named('spotbugsMain') {
    reports {
        html.required = true
        xml.required = false
    }
}

// SonarQube configuration
sonar {
    properties {
        property "sonar.projectKey", "gradle-archi-plugin"
        property "sonar.projectName", "Gradle Archi Plugin"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.java.source", "21"
    }
}

// Aggregate security scanning task
tasks.register('allSecurityChecks') {
    group = 'verification'
    description = 'Run all security and quality checks (Dependency-Check, SpotBugs, SonarQube)'
    dependsOn tasks.named('check')
    def dependencyCheckTask = tasks.findByName('dependencyCheckAnalyze') ?: tasks.findByName('dependencyCheck')
    if (dependencyCheckTask != null) {
        dependsOn dependencyCheckTask
    }
    dependsOn tasks.named('spotbugsMain')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    // Runtime binaries are required in plugin JAR, but must not be part of sources artifact.
    exclude('archi/plugins/**/*.archiplugin')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(sourceSets.main.output.classesDirs)
    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(sourceSets.main.output.classesDirs)
    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('verifyBundledArchiPlugins') {
    group = 'verification'
    description = 'Fails build when packaged Archi plugin bundle is missing or empty.'
    def jarFileProvider = tasks.named('jar').flatMap { it.archiveFile }
    dependsOn tasks.named('jar')
    inputs.file(jarFileProvider)
    doLast {
        def jarFile = jarFileProvider.get().asFile
        def found = false
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (!entry.isDirectory() && entry.name ==~ /archi\/plugins\/[^\/]+\.archiplugin/) {
                    found = true
                    break
                }
            }
        } finally {
            zip.close()
        }
        if (!found) {
            throw new GradleException("No bundled .archiplugin files found in artifact: ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn tasks.named('verifyBundledArchiPlugins')
}

def centralStagingRoot = layout.buildDirectory.dir('central-staging-repo')

def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishToMavenLocal')
    into(centralStagingRoot)

    publishing.publications.withType(MavenPublication).all { publication ->
        def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
        from(file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")) {
            into(publicationPath)
        }
    }

    doFirst {
        publishing.publications.withType(MavenPublication).each { publication ->
            def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
            def localPublicationDir = file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")
            if (!localPublicationDir.exists()) {
                throw new GradleException("Expected local Maven publication directory not found: ${localPublicationDir}")
            }
        }
    }
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
    dependsOn stageCentralBundleRepo
    notCompatibleWithConfigurationCache('Generates checksum files by scanning staged output directory at execution time.')
    doLast {
        def stagedRepoDir = centralStagingRoot.get().asFile
        if (!stagedRepoDir.exists()) {
            throw new GradleException("Expected staged repository directory not found: ${stagedRepoDir}")
        }
        def checksum = { File input, String algorithm ->
            MessageDigest digest = MessageDigest.getInstance(algorithm)
            input.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }
        stagedRepoDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                file.parentFile.toPath().resolve(file.name + '.md5').toFile().text = checksum(file, 'MD5') + System.lineSeparator()
                file.parentFile.toPath().resolve(file.name + '.sha1').toFile().text = checksum(file, 'SHA-1') + System.lineSeparator()
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn generateCentralBundleChecksums
    archiveBaseName = project.name
    archiveVersion = project.version.toString()
    archiveClassifier = 'central-bundle'
    destinationDirectory = layout.buildDirectory.dir('central-bundle').get().asFile
    from layout.buildDirectory.dir('central-staging-repo')
}
